<body data-theme="light" class="page-exp-ruta">
    <div id="ubits-toast-container"></div>
    <div class="dashboard-container">
        <div class="tooltip" id="tooltip"></div>
        <div id="sidebar-container"></div>

            <div id="top-nav-container"></div>
            <div class="content-area">
                <div class="content-sections">
                    <div class="section-single">
                        <div class="widget--transparent">
                            <div id="exp-ruta-stage" class="exp-ruta-stage exp-ruta-stage--portada" aria-live="polite"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="tab-bar-container"></div>
    <div id="floating-menu-container"></div>

    <script src="../../../bd-master/catalogo-proveedores-helpers.js"></script>
    <script src="./exp-ruta.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            initWorkspaceLayout({ audience: 'colaborador', activeSidebar: 'aprendizaje', headerVariant: 'aprendizaje' });
            loadTabBar('tab-bar-container');
            loadFloatingMenu('floating-menu-container');
            loadProfileMenu('profile-menu-container');
            if (typeof window.initExpRuta === 'function') window.initExpRuta();
        });
    </script>
