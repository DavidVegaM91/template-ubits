<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../images/playground-favicon.svg">
  <title>Sin conexión — UBITS</title>
  <link rel="stylesheet" href="../general-styles/ubits-colors.css">
  <link rel="stylesheet" href="../general-styles/styles.css">
  <link rel="stylesheet" href="../general-styles/ubits-typography.css">
  <link rel="stylesheet" href="../general-styles/ubits-spacing-tokens.css">
  <link rel="stylesheet" href="../components/button.css">
  <link rel="stylesheet" href="../components/system-error-page.css">
</head>
<body data-theme="light">
  <main class="ubits-system-error">
    <div class="ubits-system-error__content">
      <div class="ubits-system-error__illustration" style="width: 361px; height: 200px;">
        <img
          src="../images/errores/sin-conexion.svg"
          alt=""
          width="361"
          height="200"
        >
      </div>
      <div class="ubits-system-error__copy">
        <div class="ubits-system-error__info">
          <h1 class="ubits-heading-h2 ubits-system-error__title">Sin conexión a internet</h1>
          <p class="ubits-body-md-regular ubits-system-error__description">
            Parece que no estás conectado a internet. Revisa tu red y vuelve a intentarlo.
          </p>
        </div>
        <div class="ubits-system-error__actions">
          <button
            type="button"
            class="ubits-button ubits-button--primary ubits-button--lg"
            onclick="window.location.reload()"
          >Volver a intentar</button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
